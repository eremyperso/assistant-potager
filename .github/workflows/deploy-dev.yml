name: Deploy Dev
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Assistant Potager DEV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SCALEWAY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SCALEWAY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code on server
        run: |
          ssh ${{ secrets.SCALEWAY_USER }}@${{ secrets.SCALEWAY_HOST }} "
            set -euo pipefail
            cd /opt/potager-dev
            git fetch origin
            git checkout dev
            git pull origin dev
          "

      - name: Install Python dependencies
        run: |
          ssh ${{ secrets.SCALEWAY_USER }}@${{ secrets.SCALEWAY_HOST }} "
            set -euo pipefail
            cd /opt/potager-dev
            if [ ! -x venv/bin/python ]; then
              echo 'Création du virtualenv...'
              rm -rf venv
              python3 -m venv venv
            fi
            venv/bin/pip install --quiet --upgrade pip
            venv/bin/pip install --quiet -r requirements.txt
          "

      - name: Build frontend React
        run: |
          cd frontend
          echo "VITE_API_URL=https://dev.potager.eremy.fr" > .env.local
          npm install
          npm run build

      - name: Deploy frontend dist to server
        run: |
          rsync -az --delete frontend/dist/ \
            ${{ secrets.SCALEWAY_USER }}@${{ secrets.SCALEWAY_HOST }}:/opt/potager-dev/frontend/dist/

      - name: Install systemd services (API + Bot)
        run: |
          scp infra/potager-dev.service \
            ${{ secrets.SCALEWAY_USER }}@${{ secrets.SCALEWAY_HOST }}:/etc/systemd/system/potager-dev.service
          scp infra/potager-dev-bot.service \
            ${{ secrets.SCALEWAY_USER }}@${{ secrets.SCALEWAY_HOST }}:/etc/systemd/system/potager-dev-bot.service
          ssh ${{ secrets.SCALEWAY_USER }}@${{ secrets.SCALEWAY_HOST }} \
            "systemctl daemon-reload && systemctl enable potager-dev-bot.service"

      - name: Setup PostgreSQL extensions
        run: |
          ssh ${{ secrets.SCALEWAY_USER }}@${{ secrets.SCALEWAY_HOST }} "
            sudo -u postgres psql -d potager_dev -c 'CREATE EXTENSION IF NOT EXISTS unaccent;'
            sudo -u postgres psql -c 'ALTER ROLE potager_user CREATEROLE;'
          "

      - name: Apply SQL migrations
        run: |
          ssh ${{ secrets.SCALEWAY_USER }}@${{ secrets.SCALEWAY_HOST }} "
            set -euo pipefail
            cd /opt/potager-dev
            set -a && source .env.dev && set +a
            APPLIED_LOG=/opt/potager-dev/.migrations_applied
            touch \"\${APPLIED_LOG}\"
            for migration in \$(ls migrations/migration_v*.sql | sort -t v -k2 -n); do
              name=\$(basename \"\${migration}\")
              if grep -qF \"\${name}\" \"\${APPLIED_LOG}\"; then
                echo \"  [-] \${name} (déjà appliquée)\"
                continue
              fi
              echo \"  >>> Applying \${migration}...\"
              psql \"\${DATABASE_URL}\" -v ON_ERROR_STOP=1 -v chat_id_actuel='' -v lat_actuelle='' -v lon_actuelle='' -v app_user_password='${{ secrets.APP_USER_PASSWORD }}' -f \"\${migration}\"
              echo \"\${name}\" >> \"\${APPLIED_LOG}\"
            done
          "

      # [US-099 / CA10] Le corpus de connaissance se déploie comme une migration.
      # Trois propriétés le rendent sûr à rejouer à chaque déploiement :
      #   · le contrôle de cohérence /help ↔ corpus échoue AVANT toute écriture ;
      #   · l'ingestion est idempotente (empreinte SHA-256 par fichier : même
      #     contenu, aucune écriture, pas même un UPDATE) ;
      #   · --elaguer retire de l'index les fiches disparues du dépôt — c'est
      #     ainsi qu'on RETIRE un contenu devenu faux, et sans lui une fiche
      #     supprimée continuerait d'être servie indéfiniment.
      # DATABASE_URL est ici celui des migrations, donc le rôle PROPRIÉTAIRE de
      # la base : une fiche globale (potager_id NULL) est refusée à app_user par
      # le WITH CHECK de la policy RLS de migration_v42.
      - name: Ingest knowledge corpus
        run: |
          ssh ${{ secrets.SCALEWAY_USER }}@${{ secrets.SCALEWAY_HOST }} "
            set -euo pipefail
            cd /opt/potager-dev
            set -a && source .env.dev && set +a
            venv/bin/python tools/controler_aide_corpus.py
            venv/bin/python tools/ingerer_connaissance.py --strict --elaguer
          "

      - name: Restart systemd services (API + Bot)
        run: |
          ssh ${{ secrets.SCALEWAY_USER }}@${{ secrets.SCALEWAY_HOST }} "
            fuser -k 8001/tcp || true
            sleep 1
            sudo systemctl restart potager-dev.service
            sudo systemctl restart potager-dev-bot.service
          "

      - name: Smoke test
        id: smoke
        run: |
          ssh ${{ secrets.SCALEWAY_USER }}@${{ secrets.SCALEWAY_HOST }} "
            set -euo pipefail
            echo 'Attente stabilisation du service (10s)...'
            sleep 10
            status=\$(systemctl is-active potager-dev.service || true)
            if [ \"\${status}\" = 'active' ]; then
              echo 'Déploiement DEV réussi — bot dev actif'
            else
              echo \"ERREUR: service potager-dev.service non actif (status: \${status})\"
              systemctl status potager-dev.service --no-pager
              exit 1
            fi
          "

      - name: Update deploy history
        if: always()
        run: |
          ssh ${{ secrets.SCALEWAY_USER }}@${{ secrets.SCALEWAY_HOST }} "
            STATUS='success'
            if [ '${{ job.status }}' != 'success' ]; then STATUS='failure'; fi
            echo \"\$(date -u +%Y-%m-%dT%H:%M:%SZ) branch=dev commit=${{ github.sha }} actor=${{ github.actor }} status=\${STATUS}\" \
              >> /opt/potager-dev/.deploy_history
          "
